spring:
  application:
    name: pognali-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pognali}
    username: ${POSTGRES_USER:pognali}
    password: ${POSTGRES_PASSWORD:pognali-local}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    user: ${MIGRATION_DB_USER:${POSTGRES_USER:pognali}}
    password: ${MIGRATION_DB_PASSWORD:${POSTGRES_PASSWORD:pognali-local}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

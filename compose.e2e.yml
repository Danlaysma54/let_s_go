name: pognali-e2e

services:
  db:
    image: postgis/postgis:18-3.6-alpine
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pognali_e2e}
      POSTGRES_USER: ${POSTGRES_USER:-pognali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pognali-e2e}
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pognali_e2e}
      POSTGRES_USER: ${POSTGRES_USER:-pognali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pognali-e2e}
      BACKEND_PORT: 8080
    ports:
      - "${BACKEND_PORT:-58080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
